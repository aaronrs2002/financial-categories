<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analyze Your Finances by Catgory</title>
    <link href="https://bootswatch.com/5/spacelab/bootstrap.css" rel="stylesheet" id="themedStyle">
    <link href="css/style.css" rel="stylesheet" id="themedStyle">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/brands.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/solid.css" rel="stylesheet" />





    <!--<link href="https://raw.githubusercontent.com/aaronrs2002/2024-jwt-login-framework/main/client/css/style.css"
        rel="stylesheet" />
-->

    <link rel="stylesheet" href="https://aaronrs2002.github.io/black-jack/css/animate.min.css" />

    <link href="https://aaronrs2002.github.io/black-jack/css/shared.css" rel="stylesheet">
    <link rel="stylesheet" href="https://aaronrs2002.github.io/task-master/css/style.css" />
    <link href="css/style.css" rel="stylesheet">

</head>

<body class="wLogo">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="http://web-presence.biz/?src=itWebApp" target="_blank"><img
                    src="https://web-presence.biz/img/MA_Logo.png" class="img-fluid" /></a>
            <button class="navbar-toggler collapsed" onClick="toggleMobileNav('mobileNav')">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="navbar-collapse collapse">
                <ul class="navbar-nav me-auto mb-2 ml-5 mb-sm-0" id="navLinkTarget">


                </ul>

            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="co-md-6"><button class="btn btn-info btn-block"
                    onClick="window.location='https://aaronrs2002.github.io/financial-categories/';">Analyze Your
                    Finances by Catgory</button></div>
            <div class="co-md-6"><button class="btn btn-info btn-block"
                    onClick="window.location='https://aaronrs2002.github.io/budget-app/';">Compare Revenu vs
                    Income</button></div>
            <div class="col-md-6">

                <div class="card">
                    <div class="card-body">
                        <div class="form-group">
                            <ul class="list-unstyled">
                                <li><label>Name</label><input type="text" class="form-control" name="amountName" />
                                </li>
                                <li><label>Cost</label><input type="number" class="form-control" name="amountAmount" />
                                </li>

                                <li><label>Category</label>

                                    <select class="form-control" name="availableCategories"
                                        onChange="fillCategoryField()"></select>
                                    <input type="text" class="form-control" name="amountCategory" />
                                </li>
                                <li><button class="form-control btn btn-success my-3" onClick="addamount()">Add
                                        amount</button></li>
                                <li><label>amounts</label>
                                    <ul class="list-group" id="amountCategoriesListTarget"></ul>
                                </li>
                                <li><label>Total</label>
                                    <div id="amountTotalTarget"></div>
                                </li>
                                <li>
                                    <ul class="list-unstyled" id="amountListItemsTarget"></ul>
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <ul class="list-unstyled">
                    <li>
                        <div id="chart"></div>
                    </li>

                </ul>

            </div>
        </div>
    </div>
    <div class="hide alert fadeInUp" role="alert" id="globalAlert"></div>
    <footer class="footer mt-auto py-3 animated fadeInUp">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="btn-group block my-2" role="group" id="gameLinks"></div>
                </div>
                <div class="col-md-2 my-2"> <select class="form-control" onChange="changeTheme()" id="themes"></select>
                </div>
                <div class="col-md-4" id="socialList">
                </div>
                <div class="col-md-2 my-3" id="year"></div>
            </div>
        </div>
    </footer>
</body>



</body>
<script src='https://cdn.jsdelivr.net/npm/apexcharts'></script>
<script src="https://aaronrs2002.github.io/black-jack/js/footer.js"></script>
<script src="https://aaronrs2002.github.io/task-master/js/sharedFunctionality.js"></script>

<script src="js/functionality.js"></script>

</html>
