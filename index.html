<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Catgories</title>
    <link href="https://bootswatch.com/5/spacelab/bootstrap.css" rel="stylesheet" id="themedStyle">
    <link href="css/style.css" rel="stylesheet" id="themedStyle">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/brands.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/solid.css" rel="stylesheet" />
    <link href="https://raw.githubusercontent.com/aaronrs2002/2024-jwt-login-framework/main/client/css/style.css"
        rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">

                <div class="card">
                    <div class="card-body">
                        <div class="form-group">
                            <ul class="list-unstyled">
                                <li><label>Name</label><input type="text" class="form-control" name="expenseName" />
                                </li>
                                <li><label>Cost</label><input type="number" class="form-control" name="expenseAmount" />
                                </li>

                                <li><label>Category</label>

                                    <select class="form-control" name="availableCategories"
                                        onChange="fillCategoryField()"></select>
                                    <input type="text" class="form-control" name="expenseCategory" />
                                </li>
                                <li><button class="form-control btn btn-success my-3" onClick="addExpense()">Add
                                        Expense</button></li>
                                <li><label>Expenses</label>
                                    <ul class="list-group" id="expenseCategoriesListTarget"></ul>
                                </li>
                                <li><label>Total</label>
                                    <div id="expenseTotalTarget"></div>
                                </li>
                                <li>
                                    <ul class="list-unstyled" id="expenseListItemsTarget"></ul>
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <ul class="list-unstyled">
                    <li>
                        <div id="chart"></div>
                    </li>

                </ul>

            </div>
        </div>
    </div>

</body>

<script>
    let findHeight = 100;
    let theLabels = [];

    const width = window.innerWidth;
    let legendWidth = 500;

    if (width < 768) {
        findHeight = 250;
        legendWidth = 435;
    } else {
        findHeight = 100;

    }

    let currentChartData = {
        series: [],
        labels: theLabels,
        chart: {
            type: 'donut',
            total: 0,
            dataLabels: {
                enabled: true,
            },


            chart: {
                width: '100%',
            },
            legend: {
                show: true,
                showForSingleSeries: false,
                showForNullSeries: true,
                showForZeroSeries: true,
                position: 'bottom',
                horizontalAlign: 'left',
                floating: false,
                formatter: undefined,
                inverseOrder: false,
                width: legendWidth,
                height: findHeight,
                tooltipHoverFormatter: undefined,
                customLegendItems: [],
                offsetX: 15,
                offsetY: 0,
                labels: {
                    colors: undefined,
                    useSeriesColors: false
                },
                markers: {
                    width: 12,
                    height: 12,
                    strokeWidth: 0,
                    strokeColor: '#fff',
                    fillColors: undefined,
                    radius: 12,
                    customHTML: undefined,
                    onClick: undefined,
                    offsetX: 0,
                    offsetY: 0
                },
                itemMargin: {
                    horizontal: 2,
                    vertical: 0
                },
                onItemClick: {
                    toggleDataSeries: true
                },
                onItemHover: {
                    highlightDataSeries: true
                },
            },
            labels: theLabels,
            plotOptions: {
                bar: {
                    dataLabels: {
                        position: 'bottom'
                    }
                }
            },
            responsive: [{
                breakpoint: 480,
                options: {
                    chart: {
                        width: 300,
                        horizontalAlign: 'left',
                        offsetX: 0,
                        offsetY: 0,

                    },
                    legend: {
                        width: 300,
                        position: 'bottom',
                        horizontalAlign: 'left',
                        offsetX: 0,
                        offsetY: 0,
                    }
                }
            }],
            plotOptions: {
                pie: {
                    customScale: 1,
                    labels: true
                }
            }

        }
    };



    //end chart
    let categories = [];
    let expenseList = [];

    if (localStorage.getItem("expenseList")) {
        expenseList = JSON.parse(localStorage.getItem("expenseList"));
    }



    function fillCategoryField() {

        let whichCategory = document.querySelector("select[name='availableCategories']").value;
        if (whichCategory === "default") {
            return false;
        }
        document.querySelector("input[name='expenseCategory']").value = whichCategory;
    }


    function buildAvailableCategories(categories) {


        theLabels = [];
        currentChartData.series = [];
        let categoryObj = [];

        let availableCategoriesHTML = "<option value='default'>Select category</option>";
        for (let i = 0; i < categories.length; i++) {
            availableCategoriesHTML = availableCategoriesHTML + "<option value='" + categories[i] + "'>" + categories[i] + "</option>";
            categoryObj.push({
                categoryName: categories[i],
                categoryTotal: 0
            })
        }

        for (let i = 0; i < expenseList.length; i++) {
            for (let j = 0; j < categoryObj.length; j++) {
                if (expenseList[i].category === categoryObj[j].categoryName) {
                    categoryObj[j].categoryTotal = categoryObj[j].categoryTotal + Number(expenseList[i].amount);
                }
            }
        }
        console.log("JSON.stingify(categoryObj): " + JSON.stringify(categoryObj));
        document.querySelector("select[name='availableCategories']").innerHTML = availableCategoriesHTML;

        for (let i = 0; i < categoryObj.length; i++) {
            currentChartData.series.push(categoryObj[i].categoryTotal)
            theLabels.push(categoryObj[i].categoryName)
        }
        currentChartData.labels = theLabels;

        setTimeout(() => {
            //  console.log("JSON.stringify(currentChartData): " + JSON.stringify(currentChartData));
            document.querySelector("#chart").innerHTML = "";
            var chart = new ApexCharts(document.querySelector("#chart"), currentChartData);
            chart.render();
        }, 1000);

    }
    function buildTotal() {

        if (localStorage.getItem("expenseList")) {
            expenseList = JSON.parse(localStorage.getItem("expenseList"));
        }
        console.log("JSON.stringify(expenseList)" + JSON.stringify(expenseList));

        let expenseTotal = 0;
        let expenseCategoriesListTargetHTML = "";

        categories = [];

        for (let i = 0; i < expenseList.length; i++) {
            expenseTotal = expenseTotal + Number(expenseList[i].amount);
            console.log("JSON.stringify(expenseList)" + JSON.stringify(expenseList));
            console.log("categories: " + categories);
            if (categories.indexOf(expenseList[i].category) === -1) {
                categories.push(expenseList[i].category);
                console.log("We are building category HTML");



            }




        }

        for (let j = 0; j < categories.length; j++) {
            if (!document.getElementById(categories + "Expenses")) {
                expenseCategoriesListTargetHTML = expenseCategoriesListTargetHTML + `<li class="list-group-item list-group-item-action list-group-item-success">
                    <label>${categories[j]} expenses: $<span data-${categories[j].replaceAll(" ", "-")}total="0">0</span> total</label><ul class="list-group" id="${categories[j]}Expenses"></ul></li>`;
            }

        }

        console.log("categories2: " + categories);
        buildAvailableCategories(categories);/*for select men--*/

        document.getElementById("expenseCategoriesListTarget").innerHTML = expenseCategoriesListTargetHTML;






        document.querySelector("#expenseTotalTarget").innerHTML = "$" + expenseTotal;

        //span data-category="${categories[j]}-total"


        for (let i = 0; i < expenseList.length; i++) {
            for (let j = 0; j < categories.length; j++) {
                expenseListHTML = document.getElementById(categories[j] + "Expenses").innerHTML;
                if (categories[j] === expenseList[i].category) {


                    expenseListHTML = expenseListHTML + `<li class="list-group-item list-group-item-action list-group-item-info"><i class="fas fa-trash cursor-pointer"onClick="deleteListItem(${i})"></i>$${expenseList[i].amount}:${expenseList[i].name}</li>`;
                    document.getElementById(expenseList[i].category + "Expenses").innerHTML = expenseListHTML;
                    currentCategoryTotal = document.querySelector(`span[data-${categories[j].replaceAll(" ", "-")}total]`).innerHTML;
                    console.log("currentCategoryTotal: " + currentCategoryTotal);
                    if (currentCategoryTotal !== 'undefined') {
                        currentCategoryTotal = Number(currentCategoryTotal) + Number(expenseList[i].amount);
                        document.querySelector(`span[data-${categories[j]}total]`).value = currentCategoryTotal;
                        document.querySelector(`span[data-${categories[j]}total]`).innerHTML = currentCategoryTotal;
                    }


                }
            }

        }


        for (let i = 0; i < expenseList.length; i++) {





        }








    }

    function addExpense() {

        [].forEach.call(document.querySelectorAll(".error"), (e) => {
            e.classList.remove("error");
        });

        let validateFieldsList = ['expenseName', "expenseAmount", "expenseCategory"];

        for (let i = 0; i < validateFieldsList.length; i++) {
            let ckField = document.querySelector("input[name='" + validateFieldsList[i] + "']").value;
            if (!document.querySelector("input[name='" + validateFieldsList[i] + "']").value) {
                document.querySelector("input[name='" + validateFieldsList[i] + "']").classList.add("error");
                return false;
            }
        }



        let expenseName = document.querySelector("input[name='expenseName']").value;
        let expenseAmount = document.querySelector("input[name='expenseAmount']").value;
        let expenseCategory = document.querySelector("input[name='expenseCategory']").value;


        expenseList.push({ name: expenseName, amount: expenseAmount, category: expenseCategory });

        document.querySelector("input[name='expenseName']").value = "";
        document.querySelector("input[name='expenseAmount']").value = "";
        document.querySelector("input[name='expenseCategory']").value = "";
        localStorage.setItem("expenseList", JSON.stringify(expenseList));

        buildTotal();

    }



    function deleteListItem(itemNumber) {
        tempExpenseList = []
        for (let i = 0; i < expenseList.length; i++) {
            if (i !== itemNumber) {
                tempExpenseList.push(expenseList[i]);
            }
        }

        expenseList = tempExpenseList;
        localStorage.setItem("expenseList", JSON.stringify(expenseList));

        buildTotal();

    }
    buildTotal();









</script>

</html>
