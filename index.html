<body class="wLogo">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="http://web-presence.biz/?src=itWebApp" target="_blank"><img
                    src="https://web-presence.biz/img/MA_Logo.png" class="img-fluid" /></a>
            <button class="navbar-toggler collapsed" onClick="toggleMobileNav('mobileNav')">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="navbar-collapse collapse">
                <ul class="navbar-nav me-auto mb-2 ml-5 mb-sm-0" id="navLinkTarget">


                </ul>

            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">

            <div class="btn-group">

                <button class="btn btn-info active" type="button"
                    onClick="window.location='https://aaronrs2002.github.io/financial-categories/';">Analyze Your
                    Finances by Catgory</button>
                <button class="btn btn-info " type="button"
                    onClick="window.location='https://aaronrs2002.github.io/budget-app/';">Revenue vs
                    Income</button>


            </div>




            <div class="col-md-6">

                <div class="card">
                    <div class="card-body">
                        <div class="col-md-12">
                            <h1>Analyze Your Finances by Catgory</h1>
                            <small><i>Input an item name. Then the amount. After that, input a category. From there, add
                                    the
                                    item into your
                                    list. </i></small>
                        </div>
                        <div class="form-group">
                            <ul class="list-unstyled">
                                <li><label>Name</label><input type="text" class="form-control" name="amountName"
                                        placeholder="Please use only letters from A to Z (spaces allowed)" />
                                </li>
                                <li><label>Cost</label><input type="number" class="form-control" name="amountAmount"
                                        placeholder="Numbers Only (example: 910.00)" />
                                </li>

                                <li><label>Category</label>

                                    <select class="form-control hide" name="availableCategories"
                                        onChange="fillCategoryField()"></select>
                                    <input type="text" class="form-control" name="amountCategory" />
                                </li>
                                <li><button class="form-control btn btn-success my-3" onClick="addamount()">Add
                                        amount</button></li>
                                <li><label>amounts</label>
                                    <ul class="list-group" id="amountCategoriesListTarget"></ul>
                                </li>
                                <li><label>Total</label>
                                    <div id="amountTotalTarget"></div>
                                </li>
                                <li>
                                    <ul class="list-unstyled" id="amountListItemsTarget"></ul>
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <ul class="list-unstyled">
                    <li>
                        <div id="chart"></div>
                    </li>

                </ul>

                <hr />

                <div>

                    <div class="col-md-12">
                        <button class="btn btn-danger form-control" data-toggle="clearBt"
                            onClick="toggle('clearData')">Clear Data</button>
                        <div data-toggle="clearData" class="hide ">
                            <div class="list-group-item list-group-item-warning p-3">

                                <p>Are you sure you want to delete all your category data?</p>
                                <button class="btn btn-secondary p-2" onclick="toggle('clearBt')">No</button>
                                <button class="btn btn-danger p-2" onclick="clearData()">Yes</button>
                            </div>

                        </div>



                    </div>

                    <div class="col-md-12">
                        <div class="d-grid gap-2  py-2">
                            <button class="btn btn-light " onClick="javascript:downloadData();"><i
                                    class="fas fa-file-download"></i>
                                Download</button>
                        </div>
                    </div>
                    <div class="col-md-12 py-2">
                        <div class="d-grid gap-2">



                            <label class="custom-file-upload btn btn-light">
                                <input type="file" name="importFile" accept=".json"
                                    onChange="javascript:handleOnChange(event)" />
                                <i class="fa fa-cloud-upload"></i> Select a "financial-categories.json" file to upload
                            </label>

                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="d-grid gap-2  py-2">
                            <button id="fileUpload" class="btn btn-primary hide"
                                onClick="javascript:handleOnSubmit(event, 'json','default')"><i
                                    class="fas fa-file-upload"></i>
                                Upload New Data</button>
                        </div>
                        <!--  <div class="d-grid gap-2  py-2">
                            <button id="fileMerge" class="btn btn-warning hide"
                                onClick="javascript:handleOnSubmit(event, 'json','merge')"><i
                                    class="fas fa-file-upload"></i>
                                Merge with current data</button>
                        </div>-->
                    </div>



                </div>

            </div>
        </div>
    </div>
    <div class="hide alert fadeInUp" role="alert" id="globalAlert"></div>
    <footer class="footer mt-auto py-3 animated fadeInUp">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="btn-group block my-2" role="group" id="gameLinks"></div>
                </div>
                <div class="col-md-2 my-2"> <select class="form-control" onChange="changeTheme()" id="themes"></select>
                </div>
                <div class="col-md-4" id="socialList">
                </div>
                <div class="col-md-2 my-3" id="year"></div>
            </div>
        </div>
    </footer>
</body>
